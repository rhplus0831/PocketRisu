name: Tests

# Reusable test gate: runs on direct pushes to serve (the deploy branch) and
# is called by pr-check, release, and docker-build so releases cannot publish
# from an untested tree.

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "serve" ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run svelte-check
        run: pnpm check

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run client and server suites
        run: pnpm test

      - name: Run compatibility suite
        run: >
          pnpm vitest run --config vitest.config.compat.ts
          --reporter=default
          --reporter=junit --outputFile.junit=reports/compat-junit.xml
          --reporter=json --outputFile.json=reports/compat.json

      - name: Fail on unexpected compat skips
        run: node scripts/check-compat-skips.mjs reports/compat.json

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
