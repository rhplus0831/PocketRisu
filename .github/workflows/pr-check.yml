name: PR Check

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job named so the reported check stays "Linux / Test", the context this
  # repo's checks have always used.
  test:
    name: Linux
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
